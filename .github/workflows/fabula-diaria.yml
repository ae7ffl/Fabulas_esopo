name: Enviar fábula diaria

on:
  schedule:
    # Se ejecuta un par de veces por la mañana (hora UTC) como red de
    # seguridad, por si GitHub retrasa alguna. El propio script comprueba
    # si ya se envió hoy y no duplica nada.
    - cron: '0 5 * * *'
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
  workflow_dispatch: {}  # permite lanzarlo manualmente para probar

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Enviar fábula (si no se ha enviado ya hoy)
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          DEST_EMAIL: ${{ secrets.DEST_EMAIL }}
        run: python send_fabula.py

      - name: Guardar el nuevo estado en el repositorio
        run: |
          git config user.name "fabula-bot"
          git config user.email "fabula-bot@users.noreply.github.com"
          git add estado.json
          git diff --staged --quiet || git commit -m "Actualiza estado de fábula diaria"
          git push
